[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ads-ranking-pacing"
version = "0.1.0"
description = "Two-tower ad retrieval, DCNv2/ESMM ranking, and PID budget pacing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
]

[project.optional-dependencies]
faiss = ["faiss-cpu>=1.7.4"]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.scripts]
ads-train = "ads_engine.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
