services:
  server:
    build: .
    environment:
      HTTP_ADDR: ":8080"
      REDIS_ADDR: "redis:6379"
      CACHE_TTL_SECONDS: "5"
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 10
